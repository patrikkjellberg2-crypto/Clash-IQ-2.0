name: Unpack Clash IQ project

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace repo contents with the ZIP contents
        run: |
          set -e
          ZIP=$(ls *.zip 2>/dev/null | head -n 1 || true)
          if [ -z "$ZIP" ]; then
            echo "No ZIP found in the repo root"
            exit 1
          fi
          echo "Using $ZIP"
          rm -rf /tmp/new
          mkdir /tmp/new
          unzip -q "$ZIP" -d /tmp/new
          SRC=/tmp/new
          if [ "$(ls -A /tmp/new | wc -l)" = "1" ] && [ -d "/tmp/new/$(ls /tmp/new)" ]; then
            SRC="/tmp/new/$(ls /tmp/new)"
          fi
          rm -rf "$SRC/.github" "$SRC/.git"
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a "$SRC"/. .
          ls -la

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Clash IQ project" || echo "Nothing to commit"
          git push
